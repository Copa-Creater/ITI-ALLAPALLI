name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. कोड घेणे
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java सेट करणे
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Direct Gradle सेट करणे
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Keystore फाईल तयार करणे (मुख्य फोल्डरमध्ये)
      - name: Generate debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 5. ॲप बिल्ड करणे (gradlew ऐवजी फक्त gradle वापरून)
      - name: Build APK with Gradle
        run: gradle assembleDebug

      # 6. APK डाऊनलोडसाठी उपलब्ध करणे
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Allapalli-App
          path: '**/*.apk'
