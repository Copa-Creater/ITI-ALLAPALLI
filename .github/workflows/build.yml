name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission for gradlew (जर परमिशन नसेल तर)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Generate the missing debug.keystore file
      - name: Generate debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 5. Build the APK
      - name: Build APK
        run: ./gradlew assembleDebug

      # 6. Upload the generated APK so you can download it
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Allapalli-App
          path: app/build/outputs/apk/debug/app-debug.apk
